[package]
name = "keyring"
description = "Keyring — a password manager for credentials that belong to more than one person."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "keyring"

[lib]
name = "keyring_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
keyring-crypto = { path = "../crates/keyring-crypto" }
keyring-store = { path = "../crates/keyring-store" }

tauri = "2.11.5"
tauri-plugin-dialog = "2.7.2"            # backup export/restore, theme import (§7.5, §7.8)
tauri-plugin-opener = "2.5.4"            # open URLs in the default browser (§7.2, §7.4)
tauri-plugin-single-instance = "2.4.3"   # two processes on one SQLite file is a corruption path

nucleo-matcher = "0.3.1"

# Generator history and the breach cache are sealed blobs in `app_cache`, and
# postcard is what encodes them — the same choice, for the same reason, that
# ADD-002 Q13 approved for item payloads: serde_json leaves unzeroized scratch
# buffers behind, and these payloads are real passwords.
postcard = { workspace = true }

# TOTP (SPEC-V1 §4.1, §7.2). Same pinned RustCrypto generation the crypto crate
# uses, so there is still exactly one `digest`, `sha2` and `hmac` in the tree.
# `sha1` is here for RFC 6238's default algorithm as well as HIBP's k-anonymity
# hash; both are legacy interop, and neither is a security choice of ours.
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# CLAUDE.md §5 describes ts-rs as a dev-dependency. It is a normal dependency
# here and the reason is a correctness one, not convenience: `#[derive(TS)]` and
# every `#[ts(...)]` attribute must exist at compile time, so a dev-only ts-rs
# means gating ~25 attributes in commands/dto.rs behind `cfg_attr`. A mis-gated
# attribute does not fail to build — it silently drops a field from the generated
# TypeScript, which is precisely the drift the ts-rs no-diff check exists to
# catch. It contributes nothing to the shipped binary: the generated impls are
# called only by the export tests, and release LTO drops them. Export itself is
# still test-time only (`cargo test` writes src/ipc/generated/).
#
# `serde-compat` (its one default feature) stays on deliberately: it makes ts-rs
# read the `#[serde(rename_all = "camelCase")]` we already set, so the field names
# in the generated TypeScript come from the same attribute that decides the field
# names on the wire. Turning it off would mean repeating every rename as an
# `#[ts(...)]` attribute, and two lists of renames drift.
ts-rs = "12.0.1"

# ── Platform layer (ADD-002 Q13) ────────────────────────────────────────────
# The only `unsafe` in the product lives behind these, in src/platform/.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Security_Cryptography",   # DPAPI
  "Security_Credentials",          # Windows Hello / KeyCredentialManager
  "Security_Credentials_UI",       # UserConsentVerifier availability probe
  "Foundation",
  "Storage_Streams",
] }
# The WinRT async *types* are declared in this crate and referenced by the
# `windows` bindings, so naming them requires depending on it directly. Pinned to
# the same version `windows` resolves, or the types would not unify.
windows-future = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
# default-features = false throughout: the objc2 binding crates default to
# exposing an entire framework, and objc2-app-kit's defaults pull
# objc2-exception-helper, which needs a C toolchain and cannot cross-compile.
# We use three types between them, so the smaller surface is both a security
# win and what makes `cargo check --target aarch64-apple-darwin` work from a
# non-Mac.
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSString",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSPasteboard",
] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
  "std",
  "LAContext",
] }
security-framework = "3.7.0"

# Deliberately absent, and each absence is a decision:
#   tauri-plugin-clipboard-manager — exposes clipboard write to JavaScript, and
#     implements neither Windows clipboard-history exclusion nor the macOS
#     concealed type. Clipboard is hand-written in platform/ (SPEC-V1 §8).
#   arboard — same two gaps.
#   tauri-plugin-log — a file logger in a password manager is a leak channel that
#     only has to fail once.
#   tauri-plugin-os — one app_platform_info() command replaces it and costs one
#     fewer capability grant.
# The `devtools` feature is absent so DevTools compile out of release builds.

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
