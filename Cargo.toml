[workspace]
resolver = "2"
members = ["crates/keyring-crypto", "crates/keyring-store", "src-tauri", "tests/acceptance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# ─────────────────────────────────────────────────────────────────────────────
# Every version is pinned exactly. Never a wildcard, never a caret we did not
# choose. The crypto set is ONE stable RustCrypto generation (ADD-002 Q1): one
# copy of digest, sha2, rand_core, aead and curve25519-dalek in the tree, no
# release candidate anywhere in the crypto path. `cargo deny` enforces it.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]

# ── Crypto ──────────────────────────────────────────────────────────────────
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10.6", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
  "alloc",
  "getrandom",
] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = [
  "std",
  "rand_core",
  "zeroize",
] }
hkdf = "0.12.4"
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha1 = "0.10.6"                                                    # HIBP k-anonymity only
sha2 = "0.10.9"
subtle = "2.6.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }

# ── Secret handling ─────────────────────────────────────────────────────────
secrecy = "0.10.3"
zeroize = { version = "1.9.0", features = ["derive"] }

# ── Storage ─────────────────────────────────────────────────────────────────
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "blob", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["v4", "serde"] }

# ── Plumbing ────────────────────────────────────────────────────────────────
thiserror = "2.0.20"
tracing = "0.1.44"

# ── Dev ─────────────────────────────────────────────────────────────────────
hex = "0.4.3"
hex-literal = "1.1.0"
proptest = "1.11.0"
tempfile = "3.27.0"

# ─────────────────────────────────────────────────────────────────────────────
# opt-level = 3, never "s" or "z" (CLAUDE.md §2). A size-optimised Argon2 is
# slower per unit of work, so KDF calibration compensates by choosing a smaller
# memory cost — optimising for binary size silently weakens the KDF.
#
# panic = "abort": no unwinding means no catch_unwind resuming with half-zeroized
# state, and no panic payload carrying a partially formatted secret up the stack.
# Cargo forces panic = "unwind" for test targets, so `cargo test --release` is
# unaffected.
# ─────────────────────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Debug builds otherwise take tens of seconds per Argon2 derivation and nobody
# will run the tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
