<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 76" role="img" aria-label="Trynta">
  <title>Trynta</title>
  <!--
    The Trynta mark: two interlocking rings, rebuilt as geometry.

    Not a trace of the supplied PNGs. Those are 1672x941 rasters with soft edges and
    compression speckle, and downscaling one to a 16px favicon turns the rings to mush.
    This is the same construction drawn from its parameters, measured off the reference
    by scanning its alpha channel:

      ring centre-line radius   370px  ->  32.5 here
      stroke                    117px  ->  11   (ratio 0.32; the reference is 0.316)
      centre separation         523px  ->  46   (1.415 times the radius)

    The reference's two rings are not quite equal — it is a raster, and the left ring
    measures about 11% larger than the right. Nobody chose that, so this draws them
    equal. Regularising is the whole reason for rebuilding rather than tracing.

    ## Two arcs, not two circles with masks

    Each ring is an open arc with a gap where the other passes over it: the left ring
    is cut at the lower crossing, the right at the upper. The gap is 19 wide against a
    stroke of 11, so the ring underneath clears the one on top with room to read.

    Arcs rather than masked circles on purpose. A mask needs black-and-white channel
    values that are not colours but look exactly like colours to `check:tokens`, and
    masks are the first thing to go wrong when a rasteriser flattens an SVG to a 16px
    ICO frame. Two paths have neither problem.

    Geometry, so the numbers below can be checked rather than trusted: centres (38,38)
    and (84,38), radius 32.5, so the rings cross at (61, 15.04) and (61, 60.96). Each
    gap is centred on a crossing and spans +/-16.75 degrees, which is half of 19 along
    a 32.5 radius.

    `currentColor` throughout: the coloured variants beside this file set it, and
    nothing here decides which. Never recolour beyond those.
  -->
  <g fill="none" stroke="currentColor" stroke-width="11">
    <!-- Left ring, open at the lower crossing: 61.75deg round to 28.25deg. -->
    <path d="M 53.38 66.63 A 32.5 32.5 0 1 1 66.63 53.38" />
    <!-- Right ring, open at the upper crossing: 241.75deg round to 208.25deg. -->
    <path d="M 68.62 9.37 A 32.5 32.5 0 1 1 55.37 22.62" />
  </g>
</svg>
