# cargo-deny configuration.
#
# The crypto pins in Cargo.toml are only a promise until something enforces them.
# ADD-002 Q1: exactly one copy of digest, sha2, rand_core, aead, curve25519-dalek
# and getrandom. Two trait universes in one binary, in the crypto layer, in a
# password manager, is how you get a key derived by one generation and consumed
# by another.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
# Warn broadly: a Tauri tree legitimately carries duplicates of leaf crates.
# The crates that matter are denied individually below.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# ── Exactly one generation of the crypto core ────────────────────────────────
[[bans.deny]]
name = "digest"
deny-multiple-versions = true

[[bans.deny]]
name = "sha2"
deny-multiple-versions = true

[[bans.deny]]
name = "rand_core"
deny-multiple-versions = true

[[bans.deny]]
name = "aead"
deny-multiple-versions = true

[[bans.deny]]
name = "curve25519-dalek"
deny-multiple-versions = true

[[bans.deny]]
name = "crypto-common"
deny-multiple-versions = true

[[bans.deny]]
name = "getrandom"
deny-multiple-versions = true

# ── Crates that must never appear ────────────────────────────────────────────
[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "openssl-sys"

# TLS is rustls-only. ring reaching us by any other route is a supply-chain
# surprise, and the only network code in the product is HIBP and the updater.
[[bans.deny]]
name = "ring"
wrappers = ["rustls", "rustls-webpki", "webpki", "ureq"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    # ring, reached through rustls when the HIBP client and updater land in run 3.
    "OpenSSL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
