name: release

# Signed, notarised artefacts. Separate from ci.yml because it needs signing
# secrets, and signing secrets must never be reachable from a fork's pull request.
#
# PLATFORM SCOPE (ADD-005). Windows is the verified platform. The macOS artefact is
# built from code that has never been compiled anywhere else, so it is named
# UNVERIFIED PLATFORM and cannot block the Windows release. A draft release with a
# .dmg sitting beside a .msi implies parity more strongly than any prose, which is
# why the job name has to carry the caveat into the release page.
#
# Do not publish the macOS artefact to users until MACOS-UNVERIFIED.md has been
# worked through. `releaseDraft: true` is what makes that a decision someone takes
# rather than a default.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: >-
      release (${{ matrix.os }}${{ matrix.os == 'macos-latest' && ', UNVERIFIED PLATFORM' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ADD-005: an unverified platform must not block a Windows release. Remove this
    # together with the policy, not before.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # A release that has not passed the acceptance gate is not a release.
      - run: pnpm build
      - run: pnpm verify:v1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing and notarisation.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater manifest signing (SPEC-V1 §7.7). The private key never leaves
          # secrets; the public key is compiled into the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true

      - name: Installer size budget
        run: pnpm check:bundle-size 20 25
