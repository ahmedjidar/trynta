[package]
name = "keyring-crypto"
description = "Trynta key hierarchy, envelope encryption and vault manifest. Depends on nothing else in the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate is deliberately isolated: no Tauri, no SQLite, no app types. That is
# compiler-enforced by the absence of those dependencies here, not by convention,
# and it keeps the known-answer tests compiling in seconds.
[dependencies]
argon2 = { workspace = true }
blake2 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
hex-literal = { workspace = true }
proptest = { workspace = true }
