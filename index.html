<!doctype html>
<!--
  `data-theme="light"` is here rather than only in the store because it has to be
  true before any script runs. The token layer's base is dark and light is an
  attribute override, so a document that starts without the attribute paints dark
  for the frame or two it takes `hydrate` to read the stored mode over IPC. A user
  who has chosen dark loses the attribute on that same read.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trynta</title>
    <!-- The mark, rasterised per frame from the SVG. `img-src 'self'` covers it,
         and it is our own asset under /trynta/, never the third-party icon set. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/trynta/brand/trynta-mark-violet.svg" />
  </head>
  <body>
    <!-- SPEC-V1 §9: the lock screen is served as static markup so first paint does
         not wait for React. The markup lands with the lock-screen handoff; React
         hydrates into #root afterwards. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
